# ============================================================================
# FILE: android/gradle.properties
# ============================================================================
# Gradle build settings for Android Studio and the GitHub Actions cloud build.

# Memory for the build daemon. 2 GB is plenty for a project this size and keeps
# the GitHub free runner happy.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Build speed
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# --- AndroidX ---------------------------------------------------------------
# This app uses NO androidx libraries, but the flag is set to true because
# AGP 8 expects a modern configuration and it costs nothing when there are no
# dependencies. Jetifier stays off (nothing to rewrite).
android.useAndroidX=true
android.enableJetifier=false

# Faster, smaller R class generation. Safe here: the app only references
# resources from its own module.
android.nonTransitiveRClass=true

# Keep resource and source ids non-final for incremental builds.
android.nonFinalResIds=false
