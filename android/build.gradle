// ============================================================================
// FILE: android/build.gradle
// ============================================================================
// This is BOTH the root build script and the Android application module script
// (see the layout note in settings.gradle).
//
// AIDE does NOT use Gradle — it reads AndroidManifest.xml directly. This file
// is only for Android Studio and for the GitHub Actions cloud build.
//
// IMPORTANT: this project deliberately depends on NOTHING but the Android
// platform. No AppCompat, no Material, no ExoPlayer. That is why every source
// file compiles unchanged in AIDE. If you want to add ExoPlayer later, uncomment
// the media3 lines at the bottom and switch PlayerActivity over to it.
// ============================================================================

plugins {
    // Android Gradle Plugin version. Paired with Gradle 8.5.
    id 'com.android.application' version '8.2.2'
}

android {
    // AGP 8 requires the namespace here, NOT a package="..." attribute in the
    // manifest. (The AIDE copy of the manifest still needs package="..." —
    // AIDE does not read Gradle at all.)
    namespace 'com.example.ftvtv'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.ftvtv"
        minSdk 21              // Android 5.0 - covers virtually every TV box
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            debuggable true
            // Debug builds are automatically signed with the debug keystore, so
            // the APK installs on a TV straight away. This is what the cloud
            // build produces.
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // This app intentionally does a few things lint dislikes (cleartext HTTP,
    // locked landscape orientation, JavaScript enabled). Do not fail the build
    // over warnings — see docs/TROUBLESHOOTING.md for why each one is needed.
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // --- Nothing required. The app is pure platform Android. ---

    // --- OPTIONAL: in-app ExoPlayer playback (Media3) -----------------------
    // Uncomment if you want PlayerActivity to use ExoPlayer instead of
    // VideoView. ExoPlayer plays MKV/HEVC/AC3 far better than VideoView does.
    // NOTE: this adds an androidx dependency, so the project then no longer
    // compiles in AIDE.
    //
    // implementation 'androidx.media3:media3-exoplayer:1.3.1'
    // implementation 'androidx.media3:media3-ui:1.3.1'
    // implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'   // for .m3u8
}
