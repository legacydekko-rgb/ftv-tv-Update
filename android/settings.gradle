// ============================================================================
// FILE: android/settings.gradle
// ============================================================================
// Gradle entry point for the FTV TV project.
//
// NOTE ON LAYOUT — read this once, it explains the whole structure:
//
//   This project uses a SINGLE-MODULE build where the ROOT project *is* the
//   Android application module. Gradle's Android plugin looks for sources at
//   <projectDir>/src/main/..., and here projectDir is the `android/` folder,
//   so it finds:
//
//       android/src/main/AndroidManifest.xml
//       android/src/main/java/...
//       android/src/main/res/...
//       android/src/main/assets/tv_dpad.js
//
//   That is exactly the layout this project already had, so there is no `app/`
//   sub-module and therefore NO `include ':app'` line below. Build it with:
//
//       gradle -p android assembleDebug
//
//   ...or from inside the android/ folder:  gradle assembleDebug
// ============================================================================

pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "FTV TV"

// No include() calls: the root project is the Android module itself.
