name: Build Signed FTV TV APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Generate Key & Build Signed Release APK
      run: |
        # ১. সার্টিফিকেট/কি-স্টোর ফাইল তৈরি
        keytool -genkey -v -keystore release.keystore -alias ftvtv_key -keyalg RSA -keysize 2048 -validity 10000 -storepass 12345678 -keypass 12345678 -dname "CN=Sayful Islam, OU=FTV, O=FTV, L=Dhaka, C=BD"
        
        # ২. সাইন্ড রিলিজ বিল্ড চালানো
        ./gradlew assembleRelease -Pandroid.injected.signing.store.file=$(pwd)/release.keystore -Pandroid.injected.signing.store.password=12345678 -Pandroid.injected.signing.key.alias=ftvtv_key -Pandroid.injected.signing.key.password=12345678 --no-daemon

    - name: Upload Signed APK
      uses: actions/upload-artifact@v3
      with:
        name: FTV-TV-Signed-APK
        path: app/build/outputs/apk/release/*.apk
