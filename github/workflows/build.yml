name: Build Signed FTV TV APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build Unsigned Release APK
      run: gradle assembleRelease --no-daemon

    - name: Generate Certificate & Sign APK
      run: |
        # ১. ডিজিটাল সার্টিফিকেট (Keystore) তৈরি
        keytool -genkey -v -keystore release.keystore -alias ftvtv_key -keyalg RSA -keysize 2048 -validity 10000 -storepass 12345678 -keypass 12345678 -dname "CN=Sayful Islam, OU=FTV, O=FTV, L=Dhaka, C=BD"
        
        # ২. অ্যান্ড্রয়েড বিল্ড টুলস থেকে apksigner দিয়ে অ্যাপ সাইন করা
        BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
        
        # Unsigned APK খুঁজে বের করে সাইন করা
        UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
        SIGNED_APK="app/build/outputs/apk/release/FTV-TV-Signed.apk"
        
        $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-pass pass:12345678 --ks-key-alias ftvtv_key --key-pass pass:12345678 --out $SIGNED_APK $UNSIGNED_APK

    - name: Upload Signed APK
      uses: actions/upload-artifact@v4
      with:
        name: FTV-TV-Signed-APK
        path: app/build/outputs/apk/release/FTV-TV-Signed.apk
